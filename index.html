<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bé học tiếng Anh | tuananh-005</title><style>
*{box-sizing:border-box}body{margin:0;background:#acd6ff;background-image:radial-gradient(white 2px,transparent 3px);background-size:32px 32px;font-family:ui-rounded,'Trebuchet MS',Arial,sans-serif;color:#43537a}button{font:inherit;cursor:pointer}main{max-width:1180px;margin:32px auto;background:#fff;border:7px solid #ffb1c9;border-radius:44px;box-shadow:0 10px #f38db1;padding:32px 36px;min-height:85vh}.top{display:flex;justify-content:space-between;align-items:center;color:#7d88a6;font-size:14px}.badge{background:#eef5ff;border-radius:30px;padding:9px 14px}h1{text-align:center;color:#ff68a8;font-size:clamp(38px,6vw,76px);line-height:1.12;letter-spacing:-2px;text-shadow:3px 4px #d8edff;margin:42px 0 18px}h2{color:#ff538d;font-size:26px}.subtitle{text-align:center;color:#6379ed;font-size:22px;margin-bottom:40px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{text-align:center;border:5px solid #ffd1dc;border-radius:30px;padding:28px 18px}.card:nth-child(2){border-color:#d7dfff}.card:nth-child(3){border-color:#bff5ca}.emoji{font-size:74px;display:block;margin:12px}.card p{line-height:1.7;min-height:65px;color:#7b8496}.btn{border:0;border-radius:22px;padding:16px 24px;color:white;background:#49c6e8;box-shadow:0 6px #5373ef;font-weight:bold}.card .btn{width:100%}.orange{background:#ffac49;box-shadow:0 6px #e98d2b}.green{background:#32c975;box-shadow:0 6px #23a65e}.small{background:#eef3ff;border:0;border-radius:18px;padding:12px;color:#5468a7}.music{background:#fff0f6;border:2px solid #ffc1d5;border-radius:18px;padding:9px 13px;color:#ca4b7d;font-weight:bold}.game{text-align:center;max-width:720px;margin:auto}.stats{display:flex;justify-content:center;gap:12px;margin:24px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px auto}.answer{border:3px solid #d9e4ff;background:#f7faff;border-radius:20px;padding:18px;font-size:22px;color:#475782}.answer:disabled{opacity:.65;cursor:default}.feedback{min-height:48px;font-size:20px;font-weight:bold;color:#5075cb}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.tile{height:100px;border:3px solid #d6ddff;background:#edf2ff;border-radius:20px;color:#6275c3;font-weight:bold;font-size:22px}.tile.matched{background:#e0f9e9;border-color:#8ee9b1}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.rabbit{font-size:70px;transition:transform .4s}.track{background:#e7f9ec;border-bottom:8px solid #a0dfa9;border-radius:25px;text-align:left;padding:12px;overflow:hidden;margin:24px 0}footer{text-align:center;color:#94a1b8;font-size:13px;margin:36px 0 0}button:focus-visible{outline:4px solid #ff82b0;outline-offset:4px}@media(max-width:700px){main{margin:14px 10px;padding:20px 15px;border-radius:28px}.cards{grid-template-columns:1fr}.subtitle{font-size:18px}.card p{min-height:0}h1{margin-top:30px}.board{gap:7px}.tile{height:80px;font-size:17px}.top{font-size:12px}}
</style><main><div class="top"><span class="badge">🌈 tuananh-005</span><button class="music" id="musicToggle" aria-pressed="false" onclick="musicToggle()">🎵 Bật nhạc</button></div><div id="app"></div><footer>Được tạo dành cho những nhà khám phá nhỏ · tuananh-005</footer></main><script>
const app=document.getElementById('app');let audioCtx=null,musicOn=false,musicTimer=null,musicStep=0;const melody=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,1046.5,880,783.99,659.25,587.33];function musicNote(freq,when,duration,volume,wave='sine'){let osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=wave;osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(volume,when+.035);gain.gain.exponentialRampToValueAtTime(.0001,when+duration);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(when);osc.stop(when+duration+.02)}function musicTick(){if(!musicOn||!audioCtx)return;let now=audioCtx.currentTime,n=melody[musicStep%melody.length];musicNote(n,now,.27,.045,'triangle');if(musicStep%4===0)musicNote(n/2,now,.48,.018,'sine');musicStep++;musicTimer=setTimeout(musicTick,320)}async function musicToggle(){let b=document.getElementById('musicToggle');if(musicOn){musicOn=false;clearTimeout(musicTimer);if(audioCtx){await audioCtx.close();audioCtx=null}b.textContent='🎵 Bật nhạc';b.setAttribute('aria-pressed','false');return}try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC){b.textContent='Trình duyệt chưa hỗ trợ';return}audioCtx=new AC();await audioCtx.resume();musicOn=true;musicStep=0;b.textContent='🔇 Tắt nhạc';b.setAttribute('aria-pressed','true');musicTick()}catch(e){b.textContent='Không phát được nhạc'}}const words=[['🍎','Apple','Quả táo'],['🍌','Banana','Quả chuối'],['🍇','Grape','Quả nho'],['🍊','Orange','Quả cam'],['🐱','Cat','Con mèo'],['🐶','Dog','Con chó'],['🦁','Lion','Sư tử'],['🐰','Rabbit','Con thỏ'],['🚗','Car','Ô tô'],['✈️','Plane','Máy bay'],['🍦','Ice cream','Kem'],['🐼','Panda','Gấu trúc'],['🦉','Owl','Cú mèo'],['🍕','Pizza','Bánh pizza'],['⭐','Star','Ngôi sao'],['☀️','Sun','Mặt trời']];let mode,score,q,index,answered,deck,opened,lock,turns,pairs,round,timer;const shuffle=a=>[...a].sort(()=>Math.random()-.5);function speak(t){if(!('speechSynthesis'in window)){document.getElementById('feedback').textContent='Trình duyệt này chưa hỗ trợ đọc âm thanh.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function home(){clearTimeout(timer);mode='home';app.innerHTML=`<h1>BÉ HỌC TIẾNG ANH</h1><p class="subtitle">Vừa chơi vừa học, bé giỏi mỗi ngày! 🌈</p><div class="cards"><article class="card"><span class="emoji">🦁</span><h2>Đuổi Hình Bắt Chữ</h2><p>Nhìn hình thật xinh,<br>đoán từ tiếng Anh thật giỏi!</p><button class="btn" onclick="startWords()">CHƠI LUÔN →</button></article><article class="card"><span class="emoji">🧠</span><h2>Lật Thẻ Tìm Cặp</h2><p>Rèn trí nhớ siêu phàm,<br>ghép hình với từ tương ứng!</p><button class="btn orange" onclick="startMemory()">CHƠI NGAY →</button></article><article class="card"><span class="emoji">🔢</span><h2>Thử Thách Con Số</h2><p>Giúp chú Thỏ nhảy xa,<br>học các số từ 1 đến 100!</p><button class="btn green" onclick="startNumbers()">KHÁM PHÁ →</button></article></div>`}function frame(title,desc,body){app.innerHTML=`<div class="game"><div style="text-align:left;margin-top:24px"><button class="small" onclick="home()">← Trang chủ</button></div><h1 style="font-size:40px;letter-spacing:-1px">${title}</h1><p>${desc}</p>${body}</div>`}function startWords(){mode='words';score=0;index=0;q=shuffle(words).slice(0,10);wordRound()}function wordRound(){answered=false;if(index===q.length){finish('Bé đã hoàn thành!',`${score}/10 câu đúng`, 'startWords()');return}let w=q[index],opts=shuffle([w,...shuffle(words.filter(x=>x!==w)).slice(0,3)]);frame('Đuổi hình bắt chữ','Bé hãy chọn đúng tên của hình nhé!',`<div class="stats"><span class="badge">⭐ Điểm: ${score}</span><span class="badge">Câu ${index+1}/10</span></div><span class="emoji">${w[0]}</span><div class="answers">${opts.map(x=>`<button class="answer" onclick="chooseWord('${x[1]}')">${x[1]}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button class="small" onclick="speak(q[index][1])">🔊 Nghe đọc</button><button id="next" class="btn" onclick="index++;wordRound()" hidden>Câu tiếp →</button><button class="small" onclick="startWords()">↻ Chơi lại</button></div>`)}function chooseWord(v){if(answered)return;answered=true;let w=q[index];if(v===w[1])score++;document.getElementById('feedback').textContent=(v===w[1]?'🎉 Đúng rồi! ':'🌱 Đáp án là: ')+w[1]+' — '+w[2];document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===w[1])b.style.background='#dff8e9'});document.getElementById('next').hidden=false}
function startMemory(){clearTimeout(timer);mode='memory';score=0;turns=0;pairs=0;opened=[];lock=false;let chosen=shuffle(words).slice(0,6);deck=shuffle(chosen.flatMap((w,id)=>[{id,label:w[0]},{id,label:w[1]}]));frame('Lật thẻ tìm cặp','Ghép mỗi hình với tên tiếng Anh của nó.',`<div class="stats"><span class="badge" id="moves">Lượt: 0</span><span class="badge" id="pairs">Cặp: 0/6</span></div><div class="board">${deck.map((x,i)=>`<button class="tile" aria-label="Thẻ ${i+1}, chưa mở" onclick="flip(${i})">❓</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div><button class="btn orange" onclick="startMemory()">↻ Chơi lại</button>`)}function flip(i){let tiles=document.querySelectorAll('.tile');if(lock||opened.includes(i)||tiles[i].classList.contains('matched'))return;tiles[i].textContent=deck[i].label;tiles[i].setAttribute('aria-label',deck[i].label);opened.push(i);if(opened.length===2){turns++;document.getElementById('moves').textContent='Lượt: '+turns;let [a,b]=opened;if(deck[a].id===deck[b].id){tiles[a].classList.add('matched');tiles[b].classList.add('matched');tiles[a].disabled=tiles[b].disabled=true;pairs++;opened=[];document.getElementById('pairs').textContent='Cặp: '+pairs+'/6';if(pairs===6)document.getElementById('feedback').textContent='🏆 Tuyệt vời! Bé đã tìm đủ 6 cặp trong '+turns+' lượt.'}else{lock=true;timer=setTimeout(()=>{tiles[a].textContent=tiles[b].textContent='❓';tiles[a].setAttribute('aria-label','Thẻ chưa mở');tiles[b].setAttribute('aria-label','Thẻ chưa mở');opened=[];lock=false},1000)}}}
const units=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];function english(n){return n===100?'one hundred':n<20?units[n]:tens[Math.floor(n/10)]+(n%10?'-'+units[n%10]:'')}let target;function startNumbers(){mode='numbers';score=0;round=0;numberRound()}function numberRound(){answered=false;if(round===10){finish('Thỏ về đích rồi!',`${score}/10 câu đúng`,'startNumbers()');return}target=1+Math.floor(Math.random()*100);let opts=new Set([target]);while(opts.size<4)opts.add(1+Math.floor(Math.random()*100));frame('Thử thách con số','Chọn số đúng với từ tiếng Anh bên dưới!',`<div class="stats"><span class="badge">⭐ Điểm: ${score}</span><span class="badge">Chặng ${round+1}/10</span></div><div class="track"><div class="rabbit" style="transform:translateX(${round*7}%)">🐰</div></div><h2 style="color:#5579df">${english(target)}</h2><button class="small" onclick="speak(english(target))">🔊 Nghe số</button><div class="answers">${shuffle([...opts]).map(n=>`<button class="answer" onclick="chooseNumber(${n})">${n}</button>`).join('')}</div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="btn green" onclick="round++;numberRound()" hidden>Nhảy tiếp →</button>`)}function chooseNumber(n){if(answered)return;answered=true;if(n===target)score++;document.getElementById('feedback').textContent=(n===target?'🎉 Chính xác! ':'🌱 Cùng nhớ nhé: ')+english(target)+' = '+target;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(+b.textContent===target)b.style.background='#dff8e9'});document.getElementById('next').hidden=false}function finish(t,d,action){frame(t,'Mỗi lần chơi là một lần tiến bộ!','<span class="emoji">🏆</span><h2>'+d+'</h2><button class="btn" onclick="'+action+'">↻ Chơi thêm lần nữa</button>')}home();
</script></html>
